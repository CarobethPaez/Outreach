<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login — Outreach</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-box {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 12px;
      padding: 40px;
      width: 380px;
    }
    .logo { font-size: 22px; font-weight: 700; color: #7c6cfc; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #888; margin-bottom: 28px; }
    label { display: block; font-size: 12.5px; color: #888; margin-bottom: 6px; font-weight: 500; }
    input {
      width: 100%; background: #242424; border: 1px solid #2e2e2e;
      border-radius: 7px; color: #e8e8e8; padding: 10px 13px; font-size: 14px;
      outline: none; transition: border-color .15s; margin-bottom: 16px;
    }
    input:focus { border-color: #7c6cfc; }
    button {
      width: 100%; background: #7c6cfc; color: #fff; border: none;
      border-radius: 7px; padding: 11px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity .15s;
    }
    button:hover { opacity: .85; }
    .errors { background: rgba(239,68,68,.1); color: #ef4444; border: 1px solid rgba(239,68,68,.2);
      padding: 10px 14px; border-radius: 7px; font-size: 13px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">Outreach</div>
    <div class="sub">Gestión de campañas B2B — acceso privado</div>

    {% if form.errors %}
    <div class="errors">Usuario o contraseña incorrectos.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <label>Usuario</label>
      <input type="text" name="username" autofocus autocomplete="username">
      <label>Contraseña</label>
      <input type="password" name="password" autocomplete="current-password">
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
